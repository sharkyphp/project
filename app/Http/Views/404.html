<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 · 页面走丢了 · SharkyPHP</title>
<style>
  :root {
    --bg: #060912;
    --cyan: #22d3ee;
    --violet: #a855f7;
    --text: #e2e8f0;
    --muted: #8b9bb4;
    --line: rgba(120, 160, 255, 0.14);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    overflow: hidden; position: relative;
  }

  /* 背景网格 */
  .bg-grid {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(80,130,255,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(80,130,255,.06) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
    -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 72%);
  }
  .bg-glow {
    position: absolute; inset: 0; z-index: 0; pointer-events: none;
    background:
      radial-gradient(520px 360px at 50% 40%, rgba(168,85,247,.16), transparent 65%),
      radial-gradient(420px 360px at 50% 60%, rgba(34,211,238,.14), transparent 65%);
  }

  /* 雷达扫描 */
  .radar {
    position: absolute; top: 50%; left: 50%; width: 520px; height: 520px;
    transform: translate(-50%, -54%); z-index: 1; pointer-events: none; opacity: .5;
    border-radius: 50%;
    background:
      repeating-radial-gradient(circle at center, rgba(34,211,238,.10) 0 1px, transparent 1px 60px);
    border: 1px solid rgba(34,211,238,.12);
  }
  .radar::after {
    content: ""; position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, rgba(34,211,238,.35), transparent 28%);
    animation: sweep 4s linear infinite;
  }
  @keyframes sweep { to { transform: rotate(360deg); } }

  .stage { position: relative; z-index: 3; text-align: center; padding: 20px; }

  .code {
    font-size: clamp(96px, 24vw, 260px); font-weight: 900; line-height: .9; letter-spacing: -6px;
    background: linear-gradient(180deg, #ffffff, var(--cyan) 55%, var(--violet));
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 26px rgba(34,211,238,.35));
    position: relative;
  }
  /* glitch 中间 0 */
  .glitch { position: relative; display: inline-block; }
  .glitch::before, .glitch::after {
    content: attr(data-text); position: absolute; left: 0; top: 0;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    background: linear-gradient(180deg, #fff, var(--violet));
  }
  .glitch::before { color: #ff4f87; background: none; -webkit-text-fill-color: #ff4f87; clip-path: inset(0 0 55% 0); animation: g1 2.4s infinite linear alternate; }
  .glitch::after  { color: var(--cyan); background: none; -webkit-text-fill-color: var(--cyan); clip-path: inset(55% 0 0 0); animation: g2 3.1s infinite linear alternate; }
  @keyframes g1 { 0%{transform:translate(0,0)} 100%{transform:translate(-3px,2px)} }
  @keyframes g2 { 0%{transform:translate(0,0)} 100%{transform:translate(3px,-2px)} }

  h1 { font-size: 26px; margin-top: 6px; }
  .desc { color: var(--muted); margin-top: 12px; font-size: 15px; }

  .meta {
    margin: 26px auto 0; max-width: 360px; font-family: "JetBrains Mono", Consolas, monospace;
    font-size: 12.5px; color: var(--muted); text-align: left;
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px;
    background: rgba(255,255,255,.03);
  }
  .meta .row { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
  .meta .k { color: var(--violet); }
  .meta .v { color: var(--cyan); }

  .actions { margin-top: 30px; }
  .btn {
    display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px;
    padding: 13px 30px; border-radius: 10px; color: #04121a;
    background: linear-gradient(90deg, var(--cyan), #38bdf8);
    box-shadow: 0 10px 30px rgba(34,211,238,.35); transition: transform .15s, box-shadow .2s;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 16px 42px rgba(34,211,238,.5); }

  footer {
    position: absolute; bottom: 22px; z-index: 3; color: var(--muted); font-size: 12.5px;
  }
  footer a { color: var(--cyan); text-decoration: none; }
</style>
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="radar"></div>

  <div class="stage">
    <div class="code">4<span class="glitch" data-text="0">0</span>4</div>
    <h1>页面走丢了</h1>
    <p class="desc">你访问的地址不存在，或已被移动到别处。</p>

    <div class="meta">
      <div class="row"><span class="k">ERROR_CODE</span><span class="v">NOT_FOUND</span></div>
      <div class="row"><span class="k">HTTP_STATUS</span><span class="v">404</span></div>
      <div class="row"><span class="k">TRACE_ID</span><span class="v" id="trace">--</span></div>
    </div>

    <div class="actions">
      <a class="btn" href="/">返回首页</a>
    </div>
  </div>

  <footer>SharkyPHP v2 · MIT License</footer>
  
  <script>
    (function () {
      var el = document.getElementById('trace');
      if (!el) return;
      var s = 'sx-';
      var chars = '0123456789abcdef';
      for (var i = 0; i < 12; i++) { s += chars[Math.floor(Math.random() * chars.length)]; }
      el.textContent = s;
    })();
  </script>
</body>
</html>
